[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinymath-rl"
version = "0.1.0"
description = "Reproducible character-level math language modeling and RLVR experiments"
requires-python = ">=3.11"
dependencies = [
  "datasets>=2.18",
  "huggingface-hub>=0.34,<1.0",
  "hydra-core>=1.3.2",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "python-dotenv>=1.0",
  "sympy>=1.12",
  "torch==2.6.0",
  "wandb>=0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
