name: continued_sft
max_steps: ${experiment.max_steps}
batch_size: 32
# Four microbatches keep 100k optimizer updates while approximately matching
# the GRPO arm's projected 3.5–4.0x additional dense FLOPs.
gradient_accumulation: 4
learning_rate: 0.0001
weight_decay: 0.1
warmup_steps: 100
grad_clip: 1.0
eval_every: 100
save_every: 500
bf16: true
