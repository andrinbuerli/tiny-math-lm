defaults:
  - _self_
  - model: 1m
  - data: default
  - trainer: sft
  - rlvr: grpo
  - rollout: default
  - eval: default
  - qualitative: default
  - runtime: default
  - reporting: default
  - tracking: wandb
  - experiment: 01_smoke

seed: 17
init_checkpoint: null
data_bundle: null
checkpoint: null
orchestration:
  models: [1m, 10m, 100m]
  parallel_models: false
  run_grpo: true
  run_continued_sft: true
  run_comparison: true
paths:
  root: ${oc.env:WORKSPACE_ROOT,/workspace}
  data: ${paths.root}/data
  runs: ${paths.root}/runs
  outputs: ${paths.root}/outputs
tracking:
  project: tinymath-rl
  entity: ${oc.env:WANDB_ENTITY,andi-mueller-csem-sa}
  group: ${experiment.name}
  name: ${experiment.name}-${model.name}-seed${seed}
  mode: online
  tags: ["${experiment.name}", "${model.name}"]
  log_every: 10
  resume: true
hydra:
  run:
    dir: ${paths.outputs}/${experiment.name}/${model.name}/seed${seed}
  job:
    chdir: false
  output_subdir: hydra
